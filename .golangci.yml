# golangci-lint v2 configuration: https://golangci-lint.run/docs/configuration/
#
# Besides the usual correctness and style linters, depguard enforces the
# layering from docs/adr/0001-architecture.md. When a rule blocks you, the fix
# is almost always to declare a small interface (port) in the consuming
# package and wire the implementation in cmd/, not to relax the rule.
version: "2"

run:
  tests: true
  build-tags:
    - integration

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errname
    - errorlint
    - gochecknoglobals # no package-level mutable state
    - gochecknoinits # no init() side effects
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - nolintlint
    - revive
    - sloglint
    - staticcheck
    - unconvert
    - unused
    - usestdlibvars

  settings:
    errcheck:
      check-type-assertions: true

    gocritic:
      disabled-checks:
        - ifElseChain

    govet:
      enable-all: true
      disable:
        - fieldalignment # readability over struct packing
        - shadow # err shadowing is idiomatic

    misspell:
      locale: US
      ignore-rules:
        - cancelled # job status value; "canceled" is used in Go identifiers

    nolintlint:
      require-explanation: true
      require-specific: true

    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: increment-decrement
        - name: indent-error-flow
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: unused-parameter
        - name: var-declaration
        - name: var-naming

    sloglint:
      no-mixed-args: true
      kv-only: true
      static-msg: true
      key-naming-case: snake

    depguard:
      rules:
        # Libraries nobody should use.
        banned:
          files: ["$all"]
          deny:
            - pkg: github.com/pkg/errors
              desc: use the standard errors package and fmt.Errorf with %w
            - pkg: gopkg.in/yaml
              desc: use go.yaml.in/yaml/v3 (the maintained fork)
            - pkg: github.com/golang/protobuf
              desc: deprecated; use google.golang.org/protobuf
            - pkg: io/ioutil
              desc: deprecated; use io and os
            - pkg: math/rand$
              desc: use math/rand/v2 or crypto/rand

        # internal/domain is the innermost layer: standard library only.
        domain:
          list-mode: strict
          files: ["**/internal/domain/**"]
          allow:
            - $gostd

        # Use cases depend only on the domain, the pure libraries below
        # (backend registry core API, form descriptors, notification channel
        # core, cron expressions, the secret redaction leaf) and on ports they
        # declare. Allow entries are prefix matches: "$" admits the package
        # itself but not its subpackages (built-in descriptors, the contract
        # suites).
        app:
          list-mode: strict
          files: ["**/internal/app/**", "!$test"]
          allow:
            - $gostd
            - github.com/Zeptiny/Syncr/internal/domain
            - github.com/Zeptiny/Syncr/internal/backend$
            - github.com/Zeptiny/Syncr/internal/descriptor$
            - github.com/Zeptiny/Syncr/internal/notify$
            - github.com/Zeptiny/Syncr/internal/cronexpr$
            # Secret, Scrub: a pure leaf (standard library only), so use
            # cases scrub tool messages with the same code as the adapters.
            - github.com/Zeptiny/Syncr/internal/platform/redact$
        # Use-case tests (external test packages) wire the services with the
        # in-memory adapters, the built-in backends and fakes; nothing else.
        app-tests:
          list-mode: strict
          files: ["**/internal/app/**/*_test.go"]
          allow:
            - $gostd
            - github.com/Zeptiny/Syncr/internal/domain
            - github.com/Zeptiny/Syncr/internal/backend$
            - github.com/Zeptiny/Syncr/internal/backend/builtin
            - github.com/Zeptiny/Syncr/internal/descriptor$
            - github.com/Zeptiny/Syncr/internal/notify$
            - github.com/Zeptiny/Syncr/internal/notify/notifytest
            - github.com/Zeptiny/Syncr/internal/cronexpr$
            - github.com/Zeptiny/Syncr/internal/platform/redact$
            - github.com/Zeptiny/Syncr/internal/app
            - github.com/Zeptiny/Syncr/internal/adapters/memstore
            - github.com/Zeptiny/Syncr/internal/adapters/broker
            - github.com/Zeptiny/Syncr/internal/adapters/idgen
            - github.com/Zeptiny/Syncr/internal/adapters/secrets
            - github.com/Zeptiny/Syncr/internal/platform/clock

        # Platform helpers are leaves: no Syncr business code.
        platform:
          files: ["**/internal/platform/**"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/domain
              desc: platform packages are generic infrastructure
            - pkg: github.com/Zeptiny/Syncr/internal/app
              desc: platform packages are generic infrastructure
            - pkg: github.com/Zeptiny/Syncr/internal/adapters
              desc: platform packages are generic infrastructure
            - pkg: github.com/Zeptiny/Syncr/internal/controller
              desc: platform packages are generic infrastructure
            - pkg: github.com/Zeptiny/Syncr/internal/worker
              desc: platform packages are generic infrastructure
            - pkg: github.com/Zeptiny/Syncr/internal/link
              desc: platform packages are generic infrastructure
            - pkg: github.com/Zeptiny/Syncr/internal/backend
              desc: platform packages are generic infrastructure
            - pkg: github.com/Zeptiny/Syncr/gen
              desc: platform packages are generic infrastructure

        # The link core is shared by both sides of the link.
        link:
          files: ["**/internal/link/**"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/app
              desc: link is shared protocol logic; use cases call it, not the reverse
            - pkg: github.com/Zeptiny/Syncr/internal/adapters
              desc: link is shared protocol logic
            - pkg: github.com/Zeptiny/Syncr/internal/controller
              desc: link is shared by controller and worker
            - pkg: github.com/Zeptiny/Syncr/internal/worker
              desc: link is shared by controller and worker

        # Adapters never import each other; cmd/ wires them.
        adapter-api:
          files: ["**/internal/adapters/api/**", "!$test"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/
              desc: adapters must not import each other; wire them in cmd/
            - pkg: github.com/Zeptiny/Syncr/internal/controller
              desc: the API calls use cases (internal/app), not controller internals
            - pkg: github.com/Zeptiny/Syncr/internal/worker
              desc: controller code must not import worker code
        # API tests wire the real services with the in-memory adapters (store,
        # broker, cipher, IDs); nothing heavier.
        adapter-api-tests:
          files: ["**/internal/adapters/api/**/*_test.go"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/postgres
              desc: API tests use the in-memory adapters (memstore, broker, idgen, secrets)
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/notify
              desc: API tests use the in-memory adapters (memstore, broker, idgen, secrets)
            - pkg: github.com/Zeptiny/Syncr/internal/controller
              desc: the API calls use cases (internal/app), not controller internals
            - pkg: github.com/Zeptiny/Syncr/internal/worker
              desc: controller code must not import worker code
        adapter-postgres:
          files: ["**/internal/adapters/postgres/**"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/api
              desc: adapters must not import each other; wire them in cmd/
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/notify
              desc: adapters must not import each other; wire them in cmd/
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/memstore
              desc: adapters must not import each other; wire them in cmd/
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/secrets
              desc: adapters must not import each other; wire them in cmd/
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/idgen
              desc: adapters must not import each other; wire them in cmd/
            - pkg: github.com/Zeptiny/Syncr/internal/controller
              desc: the store implements app ports and knows nothing else
            - pkg: github.com/Zeptiny/Syncr/internal/worker
              desc: controller code must not import worker code
        # storetest is test support: the store's tests run it, its production
        # code must not import it.
        adapter-postgres-prod:
          files: ["**/internal/adapters/postgres/**", "!$test"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/storetest
              desc: storetest is test support; only tests may import it
        adapter-notify:
          files: ["**/internal/adapters/notify/**"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/api
              desc: adapters must not import each other; wire them in cmd/
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/postgres
              desc: adapters must not import each other; wire them in cmd/
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/memstore
              desc: adapters must not import each other; wire them in cmd/
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/secrets
              desc: adapters must not import each other; wire them in cmd/
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/idgen
              desc: adapters must not import each other; wire them in cmd/
            - pkg: github.com/Zeptiny/Syncr/internal/app
              desc: channels implement internal/notify only; the use cases call them
            - pkg: github.com/Zeptiny/Syncr/internal/controller
              desc: channels implement internal/notify and know nothing else
            - pkg: github.com/Zeptiny/Syncr/internal/worker
              desc: controller code must not import worker code

        # Every adapter implements app ports; none knows controller internals
        # or worker code.
        adapters:
          files: ["**/internal/adapters/**"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/controller
              desc: adapters implement app ports; cmd/ wires them to controller internals
            - pkg: github.com/Zeptiny/Syncr/internal/worker
              desc: controller code must not import worker code
        # The in-memory store, the broker, the cipher and the ID generator are
        # leaves among the adapters (their tests may borrow a sibling, e.g. idgen).
        adapter-memstore:
          files: ["**/internal/adapters/memstore/**", "!$test"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/
              desc: adapters must not import each other; wire them in cmd/
        adapter-broker:
          files: ["**/internal/adapters/broker/**", "!$test"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/
              desc: adapters must not import each other; wire them in cmd/
        adapter-secrets:
          files: ["**/internal/adapters/secrets/**"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/
              desc: the cipher is generic (standard library only)
        adapter-idgen:
          files: ["**/internal/adapters/idgen/**"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/
              desc: adapters must not import each other; wire them in cmd/
            - pkg: github.com/Zeptiny/Syncr/internal/app
              desc: the ID generator only mints domain IDs
        # The password hasher is argon2id and nothing else; it satisfies
        # users.PasswordHasher structurally.
        adapter-password:
          list-mode: strict
          files: ["**/internal/adapters/password/**"]
          allow:
            - $gostd
            - golang.org/x/crypto/argon2
            - github.com/Zeptiny/Syncr/internal/adapters/password

        # Backend descriptors are pure data + mapping, consumed by use cases:
        # the core API, the built-in descriptors and the contract suite use
        # only the standard library, the domain and each other.
        backend:
          list-mode: strict
          files: ["**/internal/backend/**"]
          allow:
            - $gostd
            - github.com/Zeptiny/Syncr/internal/domain
            - github.com/Zeptiny/Syncr/internal/descriptor$
            - github.com/Zeptiny/Syncr/internal/backend

        # The generic form-descriptor machinery shared by backend types and
        # notification channels: the standard library and the domain only.
        descriptor:
          list-mode: strict
          files: ["**/internal/descriptor/**"]
          allow:
            - $gostd
            - github.com/Zeptiny/Syncr/internal/domain
            - github.com/Zeptiny/Syncr/internal/descriptor

        # The notification channel core, its contract suite and the
        # channels' message type: no I/O libraries, no use cases (channels
        # under internal/adapters/notify bring their clients).
        notify:
          list-mode: strict
          files: ["**/internal/notify/**"]
          allow:
            - $gostd
            - github.com/Zeptiny/Syncr/internal/domain
            - github.com/Zeptiny/Syncr/internal/descriptor$
            - github.com/Zeptiny/Syncr/internal/notify

        # Cron expressions: robfig's parser (only) and the domain's
        # validation error.
        cronexpr:
          list-mode: strict
          files: ["**/internal/cronexpr/**"]
          allow:
            - $gostd
            - github.com/robfig/cron/v3
            - github.com/Zeptiny/Syncr/internal/domain
            - github.com/Zeptiny/Syncr/internal/cronexpr

        # Job kinds turn secret-free definitions into worker specs: protobuf,
        # the domain and the backend core API; no I/O, no use cases.
        jobkind:
          list-mode: strict
          files: ["**/internal/jobkind/**"]
          allow:
            - $gostd
            - github.com/Zeptiny/Syncr/gen
            - google.golang.org/protobuf
            - github.com/Zeptiny/Syncr/internal/domain
            - github.com/Zeptiny/Syncr/internal/backend$
            # Link feature names the kinds require of a worker.
            - github.com/Zeptiny/Syncr/internal/link$
            - github.com/Zeptiny/Syncr/internal/jobkind

        # The web UI's Go package only embeds the built SPA.
        web:
          list-mode: strict
          files: ["**/web/*.go"]
          allow:
            - $gostd

        # The development seed writes through services and ports in-process,
        # over the in-memory store only.
        devseed:
          files: ["**/internal/devseed/**"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/postgres
              desc: the seed only runs with dev.memory_store
            - pkg: github.com/Zeptiny/Syncr/internal/controller
              desc: the seed uses the use cases, not controller internals
            - pkg: github.com/Zeptiny/Syncr/internal/worker
              desc: controller code must not import worker code

        # Controller and worker never import each other.
        controller:
          files: ["**/internal/controller/**"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/worker
              desc: controller code must not import worker code
        controller-adapters:
          files: ["**/internal/controller/**", "!$test"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/adapters
              desc: controller internals are wired to adapters in cmd/
        # Controller tests may wire the in-memory adapters, nothing heavier.
        controller-tests:
          files: ["**/internal/controller/**/*_test.go"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/api
              desc: tests use the in-memory adapters (memstore, broker, idgen, secrets)
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/postgres
              desc: tests use the in-memory adapters (memstore, broker, idgen, secrets)
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/notify
              desc: tests use the in-memory adapters (memstore, broker, idgen, secrets)
        worker:
          files: ["**/internal/worker/**"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/controller
              desc: worker code must not import controller code
            - pkg: github.com/Zeptiny/Syncr/internal/app
              desc: worker code must not import controller use cases
            - pkg: github.com/Zeptiny/Syncr/internal/adapters
              desc: worker code must not import controller adapters

        # The worker link core: outbox <- agent <- linkcore <- transports.
        # The outbox is a leaf that knows only events.
        worker-outbox:
          list-mode: strict
          files: ["**/internal/worker/outbox/**"]
          allow:
            - $gostd
            - github.com/Zeptiny/Syncr/gen
            - google.golang.org/protobuf
        # The agent runs jobs through the runner contract; concrete runners
        # and tools are wired in cmd/, and it knows nothing of transports.
        worker-agent:
          files: ["**/internal/worker/agent/**", "!$test"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/worker/runner/
              desc: the agent uses the runner contract; concrete runners are registered in cmd/
            - pkg: github.com/Zeptiny/Syncr/internal/worker/proc
              desc: the agent uses the runner contract, not processes
            - pkg: github.com/Zeptiny/Syncr/internal/worker/tools
              desc: tool versions reach the agent as constructor inputs from cmd/
            - pkg: github.com/Zeptiny/Syncr/internal/worker/linkcore
              desc: linkcore builds on the agent, not the reverse
            - pkg: github.com/Zeptiny/Syncr/internal/worker/transport
              desc: transports build on linkcore, not the reverse
        # linkcore maps envelopes to agent calls; no networking, no runners.
        worker-linkcore:
          list-mode: strict
          files: ["**/internal/worker/linkcore/**", "!$test"]
          allow:
            - $gostd
            - github.com/Zeptiny/Syncr/gen
            - google.golang.org/protobuf
            - github.com/Zeptiny/Syncr/internal/link$
            - github.com/Zeptiny/Syncr/internal/worker/agent
            - github.com/Zeptiny/Syncr/internal/worker/outbox

        # The probe executor dispatches to the probers behind interfaces: it
        # knows the wire types, the local path policy and the runner
        # contract's error codes, never a concrete runner or a process. The
        # SFTP host-key prober speaks SSH itself (handshakes only, no
        # authentication), with the ssh package and none of its subpackages.
        worker-probe:
          list-mode: strict
          files: ["**/internal/worker/probe/**", "!$test"]
          allow:
            - $gostd
            - github.com/Zeptiny/Syncr/gen
            - google.golang.org/protobuf
            - github.com/Zeptiny/Syncr/internal/link$
            - github.com/Zeptiny/Syncr/internal/worker/localfs
            - github.com/Zeptiny/Syncr/internal/worker/runner$
            - golang.org/x/crypto/ssh$

        # The worker transports move linkcore envelopes over HTTP; they know
        # nothing of runners, the agent's internals or the controller.
        worker-transport:
          list-mode: strict
          files: ["**/internal/worker/transport/**", "!$test"]
          allow:
            - $gostd
            - connectrpc.com/connect
            - github.com/Zeptiny/Syncr/gen
            - google.golang.org/protobuf
            - github.com/Zeptiny/Syncr/internal/link
            - github.com/Zeptiny/Syncr/internal/worker/linkcore
        # Transport tests drive a real agent with fake runners.
        worker-transport-tests:
          list-mode: strict
          files: ["**/internal/worker/transport/**/*_test.go"]
          allow:
            - $gostd
            - connectrpc.com/connect
            - github.com/Zeptiny/Syncr/gen
            - google.golang.org/protobuf
            - github.com/Zeptiny/Syncr/internal/link
            - github.com/Zeptiny/Syncr/internal/worker/linkcore
            - github.com/Zeptiny/Syncr/internal/worker/agent
            - github.com/Zeptiny/Syncr/internal/worker/outbox
            - github.com/Zeptiny/Syncr/internal/worker/runner
            - github.com/Zeptiny/Syncr/internal/worker/tlscert
            - github.com/Zeptiny/Syncr/internal/worker/transport

        # The controller's link transports: Connect handlers and clients over
        # the dispatcher and the worker service; no adapters.
        controller-link-transports:
          list-mode: strict
          files: ["**/internal/controller/dispatch/active/**", "**/internal/controller/dispatch/passive/**", "!$test"]
          allow:
            - $gostd
            - connectrpc.com/connect
            - github.com/Zeptiny/Syncr/gen
            - google.golang.org/protobuf
            - github.com/Zeptiny/Syncr/internal/link
            - github.com/Zeptiny/Syncr/internal/domain
            - github.com/Zeptiny/Syncr/internal/app/workers
            - github.com/Zeptiny/Syncr/internal/controller/dispatch
            # The keyed token bucket of the enrollment rate limit.
            - github.com/Zeptiny/Syncr/internal/platform/ratelimit

        # End-to-end tests of the worker link wire both sides in one process
        # with the in-memory adapters; they hold no production code.
        e2e:
          files: ["**/internal/e2e/**"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/postgres
              desc: link e2e tests use the in-memory adapters (memstore, broker, idgen, secrets)
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/api
              desc: link e2e tests drive the use cases directly
            - pkg: github.com/Zeptiny/Syncr/internal/adapters/notify
              desc: link e2e tests use the in-memory adapters (memstore, broker, idgen, secrets)
            - pkg: github.com/Zeptiny/Syncr/cmd
              desc: link e2e tests wire the packages themselves

        # Sibling implementations of one extension point stay independent.
        runner-rclone:
          files: ["**/internal/worker/runner/rclone/**"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/worker/runner/restic
              desc: runners must not import each other; share code via a separate package
        runner-restic:
          files: ["**/internal/worker/runner/restic/**"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/worker/runner/rclone
              desc: runners must not import each other; share code via a separate package
        transport-active:
          files: ["**/internal/worker/transport/active/**", "**/internal/controller/dispatch/active/**"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/worker/transport/passive
              desc: transports must not import each other; share code via internal/link
            - pkg: github.com/Zeptiny/Syncr/internal/controller/dispatch/passive
              desc: transports must not import each other; share code via internal/link
        transport-passive:
          files: ["**/internal/worker/transport/passive/**", "**/internal/controller/dispatch/passive/**"]
          deny:
            - pkg: github.com/Zeptiny/Syncr/internal/worker/transport/active
              desc: transports must not import each other; share code via internal/link
            - pkg: github.com/Zeptiny/Syncr/internal/controller/dispatch/active
              desc: transports must not import each other; share code via internal/link

  exclusions:
    generated: strict
    presets:
      - std-error-handling
    paths:
      - ^gen/
    rules:
      - path: _test\.go
        linters:
          - gochecknoglobals
          - gosec
          - noctx
          - sloglint # tests log deliberately unusual shapes
      # The supervisor exists to launch configurable subprocesses; arguments
      # are built from typed specs by runners, never from a shell string.
      - path: internal/worker/proc/
        text: "G204"
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Zeptiny/Syncr
  exclusions:
    generated: strict
    paths:
      - ^gen/
