syntax = "proto3";

package syncr.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "syncr/v1/link.proto";

// Controller API used by the web UI and tooling. Served over Connect (JSON or
// binary), gRPC and gRPC-Web on the controller's HTTP address.
//
// Authentication is described in auth.proto. SystemService, SetupService and
// AuthService.Login are public; every other call needs a session or an API
// token.
//
// Errors use the standard codes:
//   - UNAUTHENTICATED: missing, expired or invalid credentials;
//   - PERMISSION_DENIED: the caller's role does not allow the call;
//   - NOT_FOUND: unknown IDs, and objects the caller may not see (another
//     user's remote or job);
//   - INVALID_ARGUMENT: malformed requests; validation failures carry a
//     ValidationError detail that names the offending fields;
//   - ALREADY_EXISTS: a name or other unique value is taken;
//   - FAILED_PRECONDITION: the object's state forbids the call;
//   - ABORTED: the object changed since the version the caller read;
//   - RESOURCE_EXHAUSTED: too many attempts (logins, setup codes).

// ValidationError is attached as an error detail to INVALID_ARGUMENT errors
// caused by invalid input, so forms can show messages next to their fields.
message ValidationError {
  repeated FieldViolation violations = 1;
}

// FieldViolation is one invalid input field.
message FieldViolation {
  // Path of the field in the request's input, e.g. "name",
  // "options.endpoint", "secrets.pass", "members[1].path".
  string field = 1;

  // What is wrong, for display.
  string message = 2;
}

// SystemService exposes information about the controller itself.
service SystemService {
  // GetInfo returns build information. It has no side effects, so Connect
  // clients may call it with HTTP GET.
  rpc GetInfo(GetInfoRequest) returns (GetInfoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// GetInfoRequest is empty; reserved for future filters.
message GetInfoRequest {}

// GetInfoResponse describes the running controller build.
message GetInfoResponse {
  // Release version, e.g. "v2.0.0", or "dev" for local builds.
  string version = 1;

  // VCS commit the binary was built from, or "unknown".
  string commit = 2;

  // When the binary was built; unset if unknown.
  google.protobuf.Timestamp build_time = 3;
}

// ---------------------------------------------------------------------------
// Workers
// ---------------------------------------------------------------------------

// WorkerAdminService enrolls, registers and manages workers.
//
// Workers are shared: every user may list and inspect them (ListWorkers,
// GetWorker) and run jobs on any of them; the other calls are admin only
// (PERMISSION_DENIED otherwise).
service WorkerAdminService {
  // CreateEnrollmentToken creates a short-lived, single-use token for
  // `syncr-worker setup --token`, with ready-to-copy install commands. The
  // token is returned once; the controller stores only its hash.
  rpc CreateEnrollmentToken(CreateEnrollmentTokenRequest) returns (CreateEnrollmentTokenResponse) {}

  // GetPassiveInstallCommands returns the commands that install a passive
  // worker (`syncr-worker setup --passive`), which then prints the URL,
  // fingerprint and pairing secret for RegisterPassiveWorker.
  rpc GetPassiveInstallCommands(GetPassiveInstallCommandsRequest) returns (GetPassiveInstallCommandsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // RegisterPassiveWorker adds a passive worker from the URL, certificate
  // fingerprint and pairing secret that `syncr-worker setup --passive`
  // printed. The controller starts calling the worker right away.
  rpc RegisterPassiveWorker(RegisterPassiveWorkerRequest) returns (RegisterPassiveWorkerResponse) {}

  // ListWorkers lists the workers that have not been removed, by name.
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // GetWorker returns one worker.
  rpc GetWorker(GetWorkerRequest) returns (GetWorkerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // RenameWorker changes a worker's display name.
  rpc RenameWorker(RenameWorkerRequest) returns (RenameWorkerResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // RemoveWorker removes a worker: its credentials stop working at once, its
  // queued jobs fail and its dispatched or running jobs become interrupted
  // (error code WORKER_REMOVED). Job history is kept.
  rpc RemoveWorker(RemoveWorkerRequest) returns (RemoveWorkerResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // SetWorkerLabels replaces a worker's labels, which schedules target by
  // label (ScheduleTarget.worker_label). Labels are lower-cased,
  // deduplicated and sorted; each matches ^[a-z0-9][a-z0-9_.-]{0,31}$ and a
  // worker has at most 16. Labels are managed by admins, never reported by
  // workers, so a worker cannot attract other users' jobs.
  rpc SetWorkerLabels(SetWorkerLabelsRequest) returns (SetWorkerLabelsResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// Worker is an enrolled or registered worker. Secrets are never returned.
message Worker {
  // Worker ID (UUID).
  string id = 1;

  // Display name.
  string name = 2;

  // Link mode.
  WorkerMode mode = 3;

  // Connection status derived from the time of the last contact.
  WorkerStatus status = 4;

  // Last authenticated contact (any link call); unset if never.
  google.protobuf.Timestamp last_seen = 5;

  // When the worker was enrolled or registered.
  google.protobuf.Timestamp created_at = 6;

  // PASSIVE only: where the controller reaches the worker.
  string url = 7;

  // PASSIVE only: the pinned certificate fingerprint, as 64 lower-case hex
  // digits.
  string cert_fingerprint = 8;

  // What the worker reported about itself in its latest Hello event; unset
  // until the worker has connected once.
  WorkerInfo info = 9;

  // Labels set by an admin (SetWorkerLabels), sorted. Schedules may target
  // any worker with a label.
  repeated string labels = 10;

  reserved 11 to 19;
}

// WorkerStatus is a worker's connection status.
enum WorkerStatus {
  WORKER_STATUS_UNSPECIFIED = 0;
  // Enrolled or registered, but never connected.
  WORKER_STATUS_PENDING = 1;
  // Heard from within the controller's offline threshold.
  WORKER_STATUS_ONLINE = 2;
  // Not heard from within the offline threshold.
  WORKER_STATUS_OFFLINE = 3;
}

// WorkerInfo is what a worker reports about itself (link Hello event).
message WorkerInfo {
  // Worker build version.
  string worker_version = 1;
  // GOOS and GOARCH of the worker process.
  string os = 2;
  string arch = 3;
  // Host name, for display.
  string hostname = 4;
  // Versions of the supervised tools.
  repeated ToolVersion tools = 5;
  // Job kinds the worker can run (JobSpec.operation field names).
  repeated string job_kinds = 6;
  // Jobs the worker runs concurrently.
  int32 max_concurrent_jobs = 7;
  // Local filesystem roots jobs may touch.
  repeated string local_roots = 8;
  // When the worker reported this (its Hello event).
  google.protobuf.Timestamp reported_at = 9;

  reserved 10 to 19;
}

// CreateEnrollmentTokenRequest configures the token.
message CreateEnrollmentTokenRequest {
  // How long the token stays valid. Unset means the controller default (1h);
  // the controller rejects values below one minute or above seven days.
  google.protobuf.Duration ttl = 1;

  // The controller URL workers should use, as the browser sees it (its
  // origin). Used in the install commands only when the controller has no
  // configured public URL (http.public_url); it must be https or a loopback
  // http URL. Empty means the configured public URL.
  string controller_url = 2;
}

// CreateEnrollmentTokenResponse carries the token, shown only once.
message CreateEnrollmentTokenResponse {
  // The token, for `syncr-worker setup --token <token>`.
  string token = 1;

  // When the token stops being accepted.
  google.protobuf.Timestamp expires_at = 2;

  // Commands that download, install and enroll a worker with this token,
  // per platform and scope. Empty if the controller URL is unknown.
  repeated InstallCommand install_commands = 3;
}

// GetPassiveInstallCommandsRequest is empty.
message GetPassiveInstallCommandsRequest {}

// GetPassiveInstallCommandsResponse lists the passive install commands.
message GetPassiveInstallCommandsResponse {
  repeated InstallCommand commands = 1;
}

// InstallCommand is a shell command to copy onto a worker machine.
message InstallCommand {
  // Operating system the command is for.
  InstallPlatform platform = 1;

  // Whether it installs a system service or a per-user one.
  InstallScope scope = 2;

  // The shell to paste it into: "sh" or "powershell".
  string shell = 3;

  // Short title, e.g. "Linux (system service)".
  string title = 4;

  // The command. It may span several lines.
  string command = 5;

  // Extra advice to show with the command (e.g. "run in an elevated
  // PowerShell"); may be empty.
  string note = 6;

  reserved 7 to 15;
}

// InstallPlatform is a worker operating system.
enum InstallPlatform {
  INSTALL_PLATFORM_UNSPECIFIED = 0;
  INSTALL_PLATFORM_LINUX = 1;
  INSTALL_PLATFORM_WINDOWS = 2;
}

// InstallScope is how a worker is installed.
enum InstallScope {
  INSTALL_SCOPE_UNSPECIFIED = 0;
  // A system service (systemd unit, Windows Service); needs root or an
  // elevated shell.
  INSTALL_SCOPE_SYSTEM = 1;
  // A per-user service (systemd user unit, Scheduled Task) for desktops
  // without admin rights.
  INSTALL_SCOPE_USER = 2;
}

// RegisterPassiveWorkerRequest describes a passive worker.
message RegisterPassiveWorkerRequest {
  // Display name, 1 to 64 characters.
  string name = 1;

  // https:// base URL where the worker serves WorkerLinkService, as reachable
  // from the controller.
  string url = 2;

  // SHA-256 fingerprint of the worker's certificate (DER) as printed by
  // setup: 64 hex digits, colons and upper case accepted.
  string cert_fingerprint = 3;

  // The pairing secret printed by setup: at least 32 printable ASCII
  // characters without spaces. The controller sends it to the worker in
  // every call and stores it encrypted.
  string pairing_secret = 4;
}

// RegisterPassiveWorkerResponse returns the new worker.
message RegisterPassiveWorkerResponse {
  Worker worker = 1;
}

// ListWorkersRequest filters the worker list.
message ListWorkersRequest {
  // Only workers with this label; empty means all.
  string label = 1;
}

// ListWorkersResponse lists workers by name.
message ListWorkersResponse {
  repeated Worker workers = 1;
}

// GetWorkerRequest names a worker.
message GetWorkerRequest {
  string worker_id = 1;
}

// GetWorkerResponse returns the worker.
message GetWorkerResponse {
  Worker worker = 1;
}

// RenameWorkerRequest sets a worker's display name.
message RenameWorkerRequest {
  string worker_id = 1;
  // New name, 1 to 64 characters.
  string name = 2;
}

// RenameWorkerResponse returns the renamed worker.
message RenameWorkerResponse {
  Worker worker = 1;
}

// RemoveWorkerRequest names the worker to remove.
message RemoveWorkerRequest {
  string worker_id = 1;
}

// RemoveWorkerResponse is empty.
message RemoveWorkerResponse {}

// SetWorkerLabelsRequest replaces a worker's labels.
message SetWorkerLabelsRequest {
  string worker_id = 1;

  // The new labels; empty removes them all. Case is ignored and duplicates
  // are dropped.
  repeated string labels = 2;
}

// SetWorkerLabelsResponse returns the worker with its new labels.
message SetWorkerLabelsResponse {
  Worker worker = 1;
}

// ---------------------------------------------------------------------------
// Jobs
// ---------------------------------------------------------------------------

// JobService runs and observes jobs.
//
// Jobs belong to the user who ran them. A user sees only their own jobs;
// an admin may view and cancel every job (ListJobs.all_users). Another
// user's job is NOT_FOUND.
service JobService {
  // RunJob queues a job on a worker. The definition refers to the caller's
  // remotes by ID and carries no secrets; it is checked for shape and path
  // syntax (INVALID_ARGUMENT with a ValidationError detail) and its remotes
  // must be the caller's live remotes (NOT_FOUND otherwise). The controller
  // resolves the remotes' credentials only when it hands the job to the
  // worker, which validates it fully and reports problems as a FAILED job.
  rpc RunJob(RunJobRequest) returns (RunJobResponse) {}

  // GetJob returns one job.
  rpc GetJob(GetJobRequest) returns (GetJobResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListJobs lists jobs, newest first.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // CancelJob cancels a job. A queued job is cancelled at once; a dispatched
  // or running job is asked to stop and becomes CANCELLED when the worker
  // confirms (if it finishes first, its own outcome stands). Cancelling a
  // finished job changes nothing. Returns the job after the request.
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  // WatchJob streams a job's status and live progress. The first message is
  // the current job; then every status change sends the job again and every
  // live sample sends progress. The stream ends after the job reaches a
  // terminal status (at once for a finished job). Intermediate progress
  // samples may be skipped for slow readers; status changes never are.
  //
  // The stream can also end before the job finishes: with DEADLINE_EXCEEDED
  // after the controller's maximum watch duration (api.watch_max_duration),
  // or with UNAVAILABLE when the controller shuts down. Clients then call
  // WatchJob again; its first message is the current job, so nothing is
  // missed.
  rpc WatchJob(WatchJobRequest) returns (stream WatchJobResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  // ListJobSamples returns the stored progress samples of a job (one about
  // every five seconds while it ran), oldest first, for charts.
  rpc ListJobSamples(ListJobSamplesRequest) returns (ListJobSamplesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

// Job is one run of a job definition on a worker.
message Job {
  // Job ID (UUID).
  string id = 1;

  // The worker that runs the job.
  string worker_id = 2;

  // Job kind: the JobSpec.operation field name, e.g. "rclone_transfer".
  string kind = 3;

  // Lifecycle status.
  JobStatus status = 4;

  // Whether a cancel was requested while the job was dispatched or running
  // and the worker has not confirmed it yet (or finished first).
  bool cancel_requested = 5;

  // When the job was created.
  google.protobuf.Timestamp created_at = 6;
  // When the worker accepted the job; unset while queued.
  google.protobuf.Timestamp dispatched_at = 7;
  // When the job's process started (worker clock); unset if it never did.
  google.protobuf.Timestamp started_at = 8;
  // When the job reached its terminal status; unset until then.
  google.protobuf.Timestamp finished_at = 9;

  // How often the job went back to the queue because its worker restarted
  // or shut down before starting it.
  int32 requeues = 10;

  // Cumulative counters: the final ones for a finished job, the latest
  // stored sample while it runs, unset before.
  JobStats stats = 11;

  // Why the job failed or was interrupted (or the cause of a cancellation);
  // unset for successful jobs.
  JobError error = 12;

  // Non-fatal problems of a successful job.
  repeated string warnings = 13;

  // Exit code of the tool process; unset if no process ran or the job has not
  // finished.
  optional int32 exit_code = 14;

  // Kind-specific output of a successful job, if the kind has any.
  JobOutput output = 15;

  // ID of the user who ran the job.
  string owner_id = 16;

  // What the job runs (never contains secrets).
  JobDefinition definition = 17;

  // The remotes the definition refers to, for display (they may since have
  // been deleted).
  repeated JobRemoteRef remotes = 18;

  // The schedule that launched the job; empty for a job run by hand. It is
  // cleared when the schedule is deleted.
  string schedule_id = 19;

  // The schedule that launched the job, for display; unset for a job run by
  // hand or whose schedule was deleted.
  JobScheduleRef schedule = 20;

  reserved 21 to 29;
}

// JobScheduleRef names the schedule that launched a job.
message JobScheduleRef {
  // Schedule ID (UUID).
  string id = 1;

  // The schedule's name.
  string name = 2;
}

// JobRemoteRef names a remote a job refers to.
message JobRemoteRef {
  // Remote ID (UUID).
  string id = 1;

  // The remote's name.
  string name = 2;

  // The remote's backend type ID.
  string backend_type = 3;

  // Whether the remote has been deleted since.
  bool deleted = 4;

  reserved 5 to 9;
}

// JobDefinition is what a job runs, as the API accepts and returns it: the
// operation with locations on the owner's remotes, referred to by ID. It
// contains no secrets; the controller builds the worker's JobSpec from it,
// with the remotes' credentials, when it dispatches the job. Field names of
// the oneof are the job kinds (the JobSpec operation names).
message JobDefinition {
  oneof operation {
    RcloneTransferDefinition rclone_transfer = 10;
  }

  // Restic operations (Milestone 5).
  reserved 20 to 29;
}

// RcloneTransferDefinition copies, syncs or moves files between two
// locations (see RcloneTransfer).
message RcloneTransferDefinition {
  // Transfer mode.
  RcloneTransferMode mode = 1;

  // Where files are read from.
  JobLocation source = 2;

  // Where files are written to.
  JobLocation destination = 3;

  // Typed allowlist of rclone flags. Unset fields use rclone defaults.
  RcloneTransferOptions options = 4;

  reserved 5 to 9;
}

// JobLocation is a path on one of the owner's remotes, or on the worker's
// local filesystem.
message JobLocation {
  // Remote ID. Empty means the worker's local filesystem: path must then be
  // absolute and inside the worker's local_roots.
  string remote_id = 1;

  // Path within the remote (relative to its root), or an absolute local
  // path.
  string path = 2;

  reserved 3 to 9;
}

// JobStatus is the lifecycle status of a job (see internal/domain).
enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  // Waiting to be accepted by its worker.
  JOB_STATUS_QUEUED = 1;
  // Accepted by the worker, not started yet.
  JOB_STATUS_DISPATCHED = 2;
  // The worker started the job's process.
  JOB_STATUS_RUNNING = 3;
  // Finished successfully. Terminal.
  JOB_STATUS_SUCCEEDED = 4;
  // Failed, or never dispatched. Terminal.
  JOB_STATUS_FAILED = 5;
  // Stopped on request. Terminal.
  JOB_STATUS_CANCELLED = 6;
  // The worker lost the job (restart, shutdown, removal). Terminal.
  JOB_STATUS_INTERRUPTED = 7;
}

// RunJobRequest queues a job.
message RunJobRequest {
  // The worker to run the job on.
  string worker_id = 1;

  // Milestone 2 took a complete JobSpec with inline credentials.
  reserved 2;
  reserved "spec";

  // What to run.
  JobDefinition definition = 3;
}

// RunJobResponse returns the queued job.
message RunJobResponse {
  Job job = 1;
}

// GetJobRequest names a job.
message GetJobRequest {
  string job_id = 1;
}

// GetJobResponse returns the job.
message GetJobResponse {
  Job job = 1;
}

// ListJobsRequest filters and pages the job list.
message ListJobsRequest {
  // Only jobs of this worker; empty means all workers.
  string worker_id = 1;

  // Only jobs in one of these statuses; empty means all.
  repeated JobStatus statuses = 2;

  // Maximum number of jobs to return: 1 to 500, 0 means 50.
  int32 page_size = 3;

  // next_page_token of the previous response; empty for the first page.
  string page_token = 4;

  // Only jobs that use this remote; empty means any.
  string remote_id = 5;

  // Only jobs of these kinds (e.g. "rclone_transfer"); empty means all.
  repeated string kinds = 6;

  // Only jobs whose kind, mode, paths or remote names contain this text
  // (case-insensitive); empty means all.
  string query = 7;

  // Only jobs created at or after created_after and before created_before;
  // unset means no bound.
  google.protobuf.Timestamp created_after = 8;
  google.protobuf.Timestamp created_before = 9;

  // Admins only: list every user's jobs instead of their own. Ignored for
  // other users.
  bool all_users = 10;

  // Only jobs launched by this schedule; empty means any.
  string schedule_id = 11;
}

// ListJobsResponse is one page of jobs, newest first.
message ListJobsResponse {
  repeated Job jobs = 1;

  // Token for the next page; empty on the last page.
  string next_page_token = 2;
}

// CancelJobRequest names the job to cancel.
message CancelJobRequest {
  string job_id = 1;
}

// CancelJobResponse returns the job after the cancel request.
message CancelJobResponse {
  Job job = 1;
}

// WatchJobRequest names the job to watch.
message WatchJobRequest {
  string job_id = 1;
}

// WatchJobResponse is one update of a watched job.
message WatchJobResponse {
  oneof update {
    // The job after a status change (and as the first message).
    Job job = 1;
    // A live progress sample of the running job.
    JobProgress progress = 2;
  }
}

// ListJobSamplesRequest names a job.
message ListJobSamplesRequest {
  string job_id = 1;
}

// ListJobSamplesResponse lists the job's stored samples, oldest first.
message ListJobSamplesResponse {
  repeated JobProgress samples = 1;
}

// JobProgress is a live progress sample. Rates are derived by clients from
// consecutive samples (delta bytes / delta time).
message JobProgress {
  // When the worker took the sample (worker clock).
  google.protobuf.Timestamp time = 1;

  // Cumulative counters.
  JobStats stats = 2;
}
