name: CI

on:
  push:
    branches: [v2, main]
  pull_request:
    branches: [v2, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  BUF_VERSION: "1.75.0"
  # Run with `go run` (pinned here and in the Makefile), so no install step is
  # needed and the generated code cannot depend on a stray local version.
  SQLC_VERSION: v1.31.1

jobs:
  lint:
    name: golangci-lint (${{ matrix.goos }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lint Windows-only files (build tags) as well as Unix ones.
        goos: [linux, windows]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true # modules and build cache, keyed by go.sum
          cache-dependency-path: go.sum
      - uses: golangci/golangci-lint-action@v9
        env:
          GOOS: ${{ matrix.goos }}
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  proto:
    name: buf lint + generate drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true # modules and build cache, keyed by go.sum
          cache-dependency-path: go.sum
      # protoc-gen-es (TypeScript) is pinned in web/package.json.
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - name: buf lint
        run: buf lint
      - name: buf format
        run: buf format --diff --exit-code
      - name: Generated code is up to date
        # Go plugins run via `go tool`, pinned by go.mod; the TypeScript
        # plugin from web/node_modules.
        run: |
          npm ci --prefix web
          buf generate
          git add -N gen web/src/gen
          git diff --exit-code -- gen web/src/gen

  sqlc:
    name: sqlc generate drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true # modules and build cache, keyed by go.sum
          cache-dependency-path: go.sum
      - name: sqlc vet
        run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@${{ env.SQLC_VERSION }} vet
      - name: Generated code is up to date
        run: |
          go run github.com/sqlc-dev/sqlc/cmd/sqlc@${{ env.SQLC_VERSION }} generate
          git add -N internal/adapters/postgres/db
          git diff --exit-code -- internal/adapters/postgres/db

  test:
    name: go test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true # modules and build cache, keyed by go.sum
          cache-dependency-path: go.sum
      - name: go vet
        run: go vet ./...
      - name: go vet (integration tests compile)
        run: go vet -tags integration ./...
      - name: go test
        run: go test ./...
      - name: go test -race
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: go mod tidy is clean
        if: runner.os == 'Linux'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  integration-linux:
    name: integration (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Fetch the pinned rclone and restic
        id: tools
        run: |
          out=$(go run ./cmd/syncr-worker tools fetch --dir "$RUNNER_TEMP/syncr-tools")
          echo "$out"
          # The last column of each line is the binary's path.
          rclone=$(echo "$out" | sed -n 's/^rclone  *[^ ]*  *[^ ]*  *[^ ]*  *//p')
          restic=$(echo "$out" | sed -n 's/^restic  *[^ ]*  *[^ ]*  *[^ ]*  *//p')
          test -x "$rclone" && test -x "$restic"
          echo "rclone=$rclone" >> "$GITHUB_OUTPUT"
          echo "restic=$restic" >> "$GITHUB_OUTPUT"
      - name: go test -tags integration
        # Docker is available on the runner, so the Postgres, MinIO and SFTP
        # (testcontainers) tests run too, and so do the end-to-end tests of
        # the real binaries (internal/e2e/system): they build both binaries,
        # run the controller on Postgres, enroll workers with `setup` and
        # kill and restart the processes mid-job.
        env:
          SYNCR_TEST_RCLONE: ${{ steps.tools.outputs.rclone }}
          SYNCR_TEST_RESTIC: ${{ steps.tools.outputs.restic }}
        run: go test -tags integration -count=1 -timeout 20m ./...
      - name: go test -race (link wiring and e2e, integration tag)
        # The unit -race run covers every package without the integration
        # tag; this adds the integration tests of the composition roots, the
        # link transports and the in-process link e2e, and again the
        # concurrent scheduling and outbox code (the scheduler under
        # internal/controller, schedules and notifications), the probes on
        # both sides and the restic use cases under the race
        # detector. (The binary e2e builds its binaries without -race, so it
        # is not repeated here.)
        env:
          SYNCR_TEST_RCLONE: ${{ steps.tools.outputs.rclone }}
          SYNCR_TEST_RESTIC: ${{ steps.tools.outputs.restic }}
        run: >-
          go test -race -tags integration -count=1 -timeout 15m
          ./cmd/...
          ./internal/e2e
          ./internal/controller/...
          ./internal/app/schedules/...
          ./internal/app/notifications/...
          ./internal/app/restic/...
          ./internal/app/jobs/...
          ./internal/jobkind/...
          ./internal/devseed/...
          ./internal/adapters/...
          ./internal/worker/agent/...
          ./internal/worker/probe/...
          ./internal/worker/linkcore/...
          ./internal/worker/transport/...
      - name: Build the worker for the service test
        run: go build -o "$RUNNER_TEMP/syncr-worker" ./cmd/syncr-worker
      - name: Real systemd service (install, start, stop, uninstall)
        # Installs the worker as a system unit on this throw-away runner, so
        # the test binary runs as root. It removes the unit again, also when
        # it fails.
        env:
          SYNCR_TEST_SERVICE: "1"
          SYNCR_TEST_WORKER: ${{ runner.temp }}/syncr-worker
          SYNCR_TEST_RCLONE: ${{ steps.tools.outputs.rclone }}
          SYNCR_TEST_RESTIC: ${{ steps.tools.outputs.restic }}
        run: |
          go test -c -tags integration -o "$RUNNER_TEMP/worker.test" ./cmd/syncr-worker
          sudo -E "$RUNNER_TEMP/worker.test" -test.run '^TestIntegrationRealService$' -test.v -test.count=1 -test.timeout 10m
      - name: Service journal (on failure)
        if: failure()
        run: sudo journalctl -u syncr-worker --no-pager -n 100 || true

  integration-windows:
    name: integration (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Fetch the pinned rclone and restic
        id: tools
        shell: pwsh
        run: |
          $out = go run ./cmd/syncr-worker tools fetch --dir "$env:RUNNER_TEMP\syncr-tools"
          if ($LASTEXITCODE -ne 0) { throw "tools fetch failed with exit code $LASTEXITCODE" }
          $out | ForEach-Object { Write-Host $_ }
          # Columns are separated by two or more spaces; the last is the path.
          foreach ($tool in 'rclone', 'restic') {
            $line = $out | Where-Object { $_ -match "^$tool\s" } | Select-Object -First 1
            $path = ($line -split '\s{2,}')[-1].Trim()
            if (-not (Test-Path -LiteralPath $path)) { throw "$tool binary not found at '$path'" }
            Add-Content -Path $env:GITHUB_OUTPUT -Value "$tool=$path" -Encoding utf8
          }
      - name: go test -tags integration
        # The Windows runner only runs Windows containers, so the tests that
        # need Linux containers (MinIO, SFTP) skip themselves with a message.
        # Everything else runs for real: rclone local transfers, union,
        # cancel, restic local lifecycle, local_roots, tool provisioning and
        # the worker wiring. -v shows each skip and its reason.
        env:
          SYNCR_TEST_RCLONE: ${{ steps.tools.outputs.rclone }}
          SYNCR_TEST_RESTIC: ${{ steps.tools.outputs.restic }}
        run: go test -v -tags integration -count=1 -timeout 30m ./...
      - name: Build the worker for the service test
        shell: pwsh
        run: go build -o "$env:RUNNER_TEMP\syncr-worker.exe" ./cmd/syncr-worker
      - name: Real Windows Service (install, start, stop, uninstall)
        # The runner is an elevated administrator and throw-away, so the
        # worker may be installed as a Windows Service; the test removes it
        # again, also when it fails.
        shell: pwsh
        env:
          SYNCR_TEST_SERVICE: "1"
          SYNCR_TEST_WORKER: ${{ runner.temp }}\syncr-worker.exe
          SYNCR_TEST_RCLONE: ${{ steps.tools.outputs.rclone }}
          SYNCR_TEST_RESTIC: ${{ steps.tools.outputs.restic }}
        run: go test -v -tags integration -count=1 -timeout 15m -run '^TestIntegrationRealService$' ./cmd/syncr-worker
      - name: Service Event Log entries (on failure)
        if: failure()
        shell: pwsh
        run: Get-WinEvent -FilterHashtable @{LogName='Application'; ProviderName='syncr-worker'} -MaxEvents 50 -ErrorAction SilentlyContinue | Format-List TimeCreated, LevelDisplayName, Message

  web:
    name: web (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Route tree is up to date
        run: npm run generate:routes && git diff --exit-code -- src/routeTree.gen.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 7

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    # The controller embeds the web UI built by the web job.
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # git describe needs tags
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true # modules and build cache, keyed by go.sum
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v7
        with:
          name: web-dist
          path: web/dist
      - name: go vet with the embedded UI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet -tags webui ./web/ ./internal/adapters/api/
      - name: Build binaries
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          # Same flags as `make build` after `make web`: the controller
          # embeds the UI (-tags webui).
          version=$(git describe --tags --match 'v*' --dirty 2>/dev/null || echo dev)
          commit=$(git rev-parse HEAD)
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          pkg=github.com/Zeptiny/Syncr/internal/platform/version
          ext=""
          if [ "$GOOS" = windows ]; then ext=.exe; fi
          mkdir -p bin
          for bin in syncr-controller syncr-worker; do
            tags=""
            if [ "$bin" = syncr-controller ]; then tags=webui; fi
            echo "building bin/$bin$ext ($GOOS/$GOARCH, $version, tags: ${tags:-none})"
            go build -trimpath -tags "$tags" \
              -ldflags "-s -w -X $pkg.version=$version -X $pkg.commit=$commit -X $pkg.buildTime=$built" \
              -o "bin/$bin$ext" "./cmd/$bin"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: syncr-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/
          if-no-files-found: error
          retention-days: 7

  docker-images:
    name: docker images (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { image: syncr-controller, dockerfile: Dockerfile.controller }
          - { image: syncr-worker, dockerfile: Dockerfile.worker }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # git describe needs tags
      - name: Version build args
        id: version
        # Same values as the build job, so the images report the same version.
        run: |
          echo "version=$(git describe --tags --match 'v*' --dirty 2>/dev/null || echo dev)" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "built=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          # The Dockerfiles COPY from the repository root.
          context: .
          file: deploy/${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            COMMIT=${{ steps.version.outputs.commit }}
            BUILD_TIME=${{ steps.version.outputs.built }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Smoke test syncr-controller
        if: matrix.image == 'syncr-controller'
        # The image is distroless (no shell), so the entrypoint is overridden
        # to call the binary directly. The health check must fail here: no
        # server is running in the container. Then a throw-away controller
        # (in-memory store) must serve the embedded web UI, not the
        # placeholder of builds without -tags webui.
        run: |
          docker run --rm --entrypoint /usr/local/bin/syncr-controller syncr-controller:ci -version
          if docker run --rm --entrypoint /usr/local/bin/syncr-controller syncr-controller:ci -healthcheck; then
            echo "::error::-healthcheck succeeded without a running server"
            exit 1
          fi
          docker run -d --name syncr-smoke -p 127.0.0.1:18080:8080 \
            -e SYNCR_DEV_MEMORY_STORE=true -e SYNCR_SECRETS_KEY="$(openssl rand -base64 32)" syncr-controller:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1 && break
            sleep 1
          done
          page=$(curl -fsS http://127.0.0.1:18080/)
          docker logs syncr-smoke 2>&1 | grep -q 'setup_code' || { echo "::error::no setup code logged"; docker logs syncr-smoke; exit 1; }
          docker rm -f syncr-smoke
          if echo "$page" | grep -qi "built without the web UI"; then
            echo "::error::the image serves the placeholder page instead of the web UI"
            exit 1
          fi
          echo "$page" | grep -q '<script type="module"' || { echo "::error::unexpected index.html: $page"; exit 1; }
      - name: Smoke test syncr-worker
        if: matrix.image == 'syncr-worker'
        # The pinned rclone and restic must be runnable inside the image.
        run: |
          docker run --rm --entrypoint /usr/local/bin/syncr-worker syncr-worker:ci version
          docker run --rm --entrypoint /usr/local/bin/rclone syncr-worker:ci version
          docker run --rm --entrypoint /usr/local/bin/restic syncr-worker:ci version
