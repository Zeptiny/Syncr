# Dependency updates, against main. Minor and patch updates of an ecosystem
# come as one pull request a week; each major update comes on its own.
# Security updates are not grouped and come as soon as an advisory appears.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      go:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    target-branch: main
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]

  # The workflows pin actions to commit SHAs with a version comment;
  # Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    target-branch: main
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]

  # deploy/Dockerfile.*: the base images. RCLONE_VERSION and RESTIC_VERSION
  # (and the checksums of their licence texts) must match the tools the
  # worker pins (internal/worker/tools): change them together, by hand.
  - package-ecosystem: docker
    directory: /deploy
    target-branch: main
    schedule:
      interval: weekly
    groups:
      images:
        patterns: ["*"]
        update-types: [minor, patch]
