# Code generation: https://buf.build/docs/configuration/v2/buf-gen-yaml
#
# The Go plugins run through `go tool`, so their versions are pinned by go.mod
# (the same google.golang.org/protobuf and connectrpc.com/connect versions the
# code links against). The TypeScript plugin (protoc-gen-es, which also emits
# the Connect service descriptors) is pinned in web/package.json and writes
# into web/src/gen, where the generated imports of @bufbuild/protobuf resolve
# against web/node_modules: run `npm ci --prefix web` before `buf generate`.
# Output is committed; CI fails if it drifts.
version: v2
clean: true
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/Zeptiny/Syncr/gen/go
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["node", "web/node_modules/@bufbuild/protoc-gen-es/bin/protoc-gen-es"]
    out: web/src/gen
    opt: [target=ts, import_extension=none]
