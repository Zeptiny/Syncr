# Syncr quick start: the controller (API and web UI) and Postgres.
# Production-style: data in named volumes, secrets from deploy/.env,
# restart policies, health checks.
#
#   cp deploy/.env.example deploy/.env      # then fill in the two secrets
#   docker compose -f deploy/docker-compose.yml up -d --build --wait
#   docker compose -f deploy/docker-compose.yml logs controller | grep setup_code
#
# Then open the web UI (http://127.0.0.1:8080, or SYNCR_PUBLIC_URL), enter
# the setup code from the log and create the first admin account. Until
# that is done the controller logs a new code on every start.
#
# The controller listens on port 8080 with plain HTTP. Browsers should and
# workers on other machines must reach it over HTTPS (workers accept plain
# http only on loopback): put a TLS-terminating reverse proxy in front of it
# and set SYNCR_PUBLIC_URL to its https:// URL (which also makes the session
# cookie Secure), or let the controller serve TLS itself
# (SYNCR_HTTP_TLS_CERT_FILE / _KEY_FILE below). Behind a proxy, set the
# proxy's read/idle timeout above 40 s (workers long-poll for 25 s) and
# allow request bodies of 16 MiB.
#
# For development dependencies only (Postgres, MinIO, SFTP with public
# credentials) see docker-compose.dev.yml instead.
name: syncr

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: syncr
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: syncr
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syncr -d syncr"]
      interval: 5s
      timeout: 3s
      retries: 20

  controller:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.controller
    image: ${SYNCR_CONTROLLER_IMAGE:-syncr-controller:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SYNCR_DATABASE_URL: postgres://syncr:${POSTGRES_PASSWORD}@postgres:5432/syncr?sslmode=disable
      SYNCR_SECRETS_KEY: ${SYNCR_SECRETS_KEY:?set SYNCR_SECRETS_KEY in deploy/.env}
      # The URL browsers and workers use, e.g. https://syncr.example.com
      # (empty: the browser's address goes into worker install commands).
      SYNCR_PUBLIC_URL: ${SYNCR_PUBLIC_URL:-}
      # Empty: a random first-run setup code, logged at start.
      SYNCR_SETUP_CODE: ${SYNCR_SETUP_CODE:-}
      SYNCR_LOG_FORMAT: ${SYNCR_LOG_FORMAT:-json}
      # Which addresses notifications (Discord, email, webhooks) may reach:
      # private (the default: not loopback, link-local or cloud metadata;
      # the LAN is fine), public (no private networks either) or any; plus
      # CIDRs or IPs allowed anyway, comma-separated.
      SYNCR_NOTIFY_NETWORK_POLICY: ${SYNCR_NOTIFY_NETWORK_POLICY:-private}
      SYNCR_NOTIFY_ALLOWED_NETWORKS: ${SYNCR_NOTIFY_ALLOWED_NETWORKS:-}
      # Serve HTTPS directly (no reverse proxy): mount the certificate and
      # uncomment. The files are re-read when they change.
      # SYNCR_HTTP_TLS_CERT_FILE: /certs/fullchain.pem
      # SYNCR_HTTP_TLS_KEY_FILE: /certs/privkey.pem
      # Behind a reverse proxy: let the login and enrollment rate limits
      # see the client's address (the proxy must set or append this header).
      # SYNCR_HTTP_CLIENT_IP_HEADER: X-Forwarded-For
      # SYNCR_HTTP_TRUSTED_PROXIES: 172.16.0.0/12
    # volumes:
    #   - ./certs:/certs:ro
    ports:
      - "${SYNCR_PUBLISH:-8080}:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/syncr-controller", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Optional: a worker in a container, next to the controller. It shares the
  # controller's network namespace, so it reaches the controller on
  # http://127.0.0.1:8080 (workers accept plain http only on loopback). On
  # first start it enrolls with SYNCR_WORKER_TOKEN (an enrollment token from
  # Workers, Add worker in the web UI) and keeps its configuration in the
  # worker-data volume; later
  # starts reuse it. Mount the directories jobs may use under /data; the
  # container user (uid 10001) needs access to them.
  #
  # worker:
  #   build:
  #     context: ..
  #     dockerfile: deploy/Dockerfile.worker
  #   image: ${SYNCR_WORKER_IMAGE:-syncr-worker:local}
  #   restart: unless-stopped
  #   network_mode: service:controller
  #   depends_on:
  #     controller:
  #       condition: service_healthy
  #   environment:
  #     SYNCR_ENROLLMENT_TOKEN: ${SYNCR_WORKER_TOKEN:-}
  #   entrypoint: ["/bin/sh", "-c"]
  #   command:
  #     - >-
  #       test -f /var/lib/syncr/worker.yaml ||
  #       syncr-worker setup --no-service --name compose-worker
  #       --controller http://127.0.0.1:8080 --local-root /data
  #       --data-dir /var/lib/syncr --config /var/lib/syncr/worker.yaml &&
  #       exec syncr-worker run --config /var/lib/syncr/worker.yaml
  #   volumes:
  #     - worker-data:/var/lib/syncr
  #     - /srv/syncr-data:/data

volumes:
  postgres-data:
  # worker-data:
